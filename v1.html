<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groq Multi-Turn AI</title>
  <style>
    :root {
      --bg-dark: #131314;
      --chat-bg: #1E1F22;
      --accent-color: #A8C7FA;
      --text-color: #E3E3E3;
      --muted-text: #8E918F;
      --ai-header: #7CACF8;
      --border-color: #333538;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app-container {
      width: 550px;
      height: 700px;
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    /* Header */
    .header {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 14pt;
      font-weight: bold;
      color: var(--accent-color);
    }

    .model-select {
      background-color: var(--chat-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 9pt;
      outline: none;
      cursor: pointer;
    }

    /* Chat Display Area */
    .chat-display {
      flex: 1;
      background-color: var(--chat-bg);
      margin: 0 20px 15px 20px;
      padding: 15px;
      border-radius: 8px;
      overflow-y: auto;
      font-size: 10pt;
      line-height: 1.5;
    }

    .msg-user-header {
      color: var(--accent-color);
      font-weight: bold;
      margin-top: 10px;
    }

    .msg-ai-header {
      color: var(--ai-header);
      font-weight: bold;
      margin-top: 10px;
    }

    .msg-thinking {
      color: var(--muted-text);
      font-style: italic;
      font-size: 9pt;
    }

    .msg-body {
      color: var(--text-color);
      margin-bottom: 15px;
      white-space: pre-wrap;
    }

    .msg-system-info {
      color: var(--muted-text);
      font-style: italic;
      font-size: 9pt;
      text-align: center;
      margin: 10px 0;
    }

    /* Input Frame */
    .input-frame {
      margin: 0 20px 20px 20px;
      background-color: var(--chat-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 6px 10px;
    }

    .message-entry {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 11pt;
      padding: 8px 10px;
      outline: none;
    }

    .send-button {
      background-color: var(--accent-color);
      color: #000000;
      font-size: 9pt;
      font-weight: bold;
      border: none;
      padding: 6px 15px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .send-button:hover {
      background-color: #7CACF8;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div id="titleLabel" class="header-title"></div>
      <select id="modelSelect" class="model-select">
        <option value="qwen/qwen3.6-27b">qwen/qwen3.6-27b</option>
        <option value="openai/gpt-oss-120b">openai/gpt-oss-120b</option>
        <option value="openai/gpt-oss-20b">openai/gpt-oss-20b</option>
        <option value="meta-llama/llama-prompt-guard-2-22m">meta-llama/llama-prompt-guard-2-22m</option>
        <option value="meta-llama/llama-prompt-guard-2-86m">meta-llama/llama-prompt-guard-2-86m</option>
      </select>
    </div>

    <div id="chatDisplay" class="chat-display"></div>

    <div class="input-frame">
      <input type="text" id="messageEntry" class="message-entry" placeholder="Type a message..." />
      <button id="sendButton" class="send-button">Send</button>
    </div>
  </div>

  <script>
    // Encoded Base64 string for the new key
    const ENCODED_KEY = 'Z3NrX0U4dmtUVFRsRHNDc29Kc2RUaE5BV0dkeWIzRllMExVwOE5rYXkyWDFPOGpoNURyQWNMQ28=';
    const API_KEY = atob(ENCODED_KEY);
    
    const TEXT_PROMPTS = [
      "What's on the agenda?",
      "What is on your mind?",
      "Fresh ideas? Ask away.",
      "Ready to brainstorm?",
      "What are we building today?",
      "What problem are we solving?"
    ];

    let currentModel = "qwen/qwen3.6-27b";
    let conversationHistory = [];

    // UI Elements
    const titleLabel = document.getElementById('titleLabel');
    const modelSelect = document.getElementById('modelSelect');
    const chatDisplay = document.getElementById('chatDisplay');
    const messageEntry = document.getElementById('messageEntry');
    const sendButton = document.getElementById('sendButton');

    // Init Header Title
    titleLabel.textContent = TEXT_PROMPTS[Math.floor(Math.random() * TEXT_PROMPTS.length)];

    // Model Switch Listener
    modelSelect.addEventListener('change', (e) => {
      currentModel = e.target.value;
      conversationHistory = [];
      appendSystemMessage(`--- Switched model to ${currentModel} (Chat reset) ---`);
    });

    // Send Handlers
    sendButton.addEventListener('click', sendMessage);
    messageEntry.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function appendSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'msg-system-info';
      div.textContent = text;
      chatDisplay.appendChild(div);
      scrollToBottom();
    }

    function scrollToBottom() {
      chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    async function sendMessage() {
      const text = messageEntry.value.trim();
      if (!text) return;

      // Render User Input
      const userHeader = document.createElement('div');
      userHeader.className = 'msg-user-header';
      userHeader.textContent = 'You';
      
      const userBody = document.createElement('div');
      userBody.className = 'msg-body';
      userBody.textContent = text;

      chatDisplay.appendChild(userHeader);
      chatDisplay.appendChild(userBody);

      // Render Thinking State
      const aiHeader = document.createElement('div');
      aiHeader.className = 'msg-ai-header';
      aiHeader.textContent = 'Groq ';

      const thinkingSpan = document.createElement('span');
      thinkingSpan.className = 'msg-thinking';
      thinkingSpan.textContent = 'thinking...';
      aiHeader.appendChild(thinkingSpan);

      chatDisplay.appendChild(aiHeader);
      scrollToBottom();

      messageEntry.value = '';

      // API Call Execution
      const startTime = performance.now();
      conversationHistory.push({ role: 'user', content: text });

      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: currentModel,
            messages: conversationHistory
          })
        });

        const elapsedSeconds = ((performance.now() - startTime) / 1000).toFixed(2);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || 'API Request Failed');
        }

        const responseText = data.choices[0]?.message?.content || 'No response generated.';
        conversationHistory.push({ role: 'assistant', content: responseText });

        // Update thinking indicator with time elapsed
        thinkingSpan.textContent = `(${elapsedSeconds}s)`;

        // Append AI Body
        const aiBody = document.createElement('div');
        aiBody.className = 'msg-body';
        aiBody.textContent = responseText;
        chatDisplay.appendChild(aiBody);

      } catch (err) {
        const elapsedSeconds = ((performance.now() - startTime) / 1000).toFixed(2);
        
        // Remove failed user turn from history array
        if (conversationHistory.length > 0 && conversationHistory[conversationHistory.length - 1].role === 'user') {
          conversationHistory.pop();
        }

        thinkingSpan.textContent = `(${elapsedSeconds}s)`;
        
        const errorBody = document.createElement('div');
        errorBody.className = 'msg-body';
        errorBody.textContent = `Error: ${err.message}`;
        chatDisplay.appendChild(errorBody);
      }

      scrollToBottom();
    }
  </script>
</body>
</html>
